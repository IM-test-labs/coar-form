<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CO Annual Requirements</title>
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar with save status; start screen card; form = section rail + question cards with traffic-light boxes */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#eef1f3; --line:#d9dfe3; --fg:#1c2529; --muted:#5d6b72;
  --accent:#1f4e5f; --accent-fg:#ffffff; --accent-soft:#e2ecef;
  --red:#c8372d; --red-soft:#f8e1de; --amber:#d99a00; --amber-soft:#fbf0d2; --green:#2e8540; --green-soft:#dff0e2;
  --na:#8a979d; --na-soft:#e7eaec; --empty:#eceff1; --amber-fg:#2b2100; --on-solid:#ffffff;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181b; --surface:#1a2226; --surface-2:#222c31; --line:#314047; --fg:#e4eaec; --muted:#9aa9b0;
  --accent:#7fb3c4; --accent-fg:#0e1417; --accent-soft:#1f3139;
  --red:#e0584d; --red-soft:#3a1f1c; --amber:#e9b132; --amber-soft:#3a3018; --green:#4fae62; --green-soft:#1c3322;
  --na:#6f7c82; --na-soft:#2a3337; --empty:#232c30; --amber-fg:#1b1500; --on-solid:#0e1417; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --surface:#1a2226; --surface-2:#222c31; --line:#314047; --fg:#e4eaec; --muted:#9aa9b0;
  --accent:#7fb3c4; --accent-fg:#0e1417; --accent-soft:#1f3139;
  --red:#e0584d; --red-soft:#3a1f1c; --amber:#e9b132; --amber-soft:#3a3018; --green:#4fae62; --green-soft:#1c3322;
  --na:#6f7c82; --na-soft:#2a3337; --empty:#232c30; --amber-fg:#1b1500; --on-solid:#0e1417; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-fg)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-size:1.02rem}
.brand span{font-size:.78rem;opacity:.85}
.savest{display:flex;align-items:center;gap:7px;font-size:.82rem;background:rgba(0,0,0,.18);padding:5px 11px;border-radius:99px;white-space:nowrap}
.savest i{width:9px;height:9px;border-radius:50%;background:#7fd48f;display:inline-block}
.savest[data-s="saving"] i{background:#f3d36b}
.savest[data-s="offline"] i,.savest[data-s="error"] i{background:#ff8a80}
.who{font-size:.8rem;opacity:.9;white-space:nowrap}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:.8rem;padding:0}
.demo-chip{font-size:.72rem;border:1px solid currentColor;border-radius:99px;padding:2px 8px;white-space:nowrap}

.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:var(--r);padding:24px;max-width:680px;margin:24px auto;display:grid;gap:16px}
.card h1{font-size:1.4rem}
.card p{margin:0;color:var(--muted)}
.grid3{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.78rem;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.fld input:disabled,.fld select:disabled{background:var(--surface-2)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--on-solid)}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:.86rem;border-radius:6px;padding:10px 14px;background:var(--accent-soft)}
.note.warn{background:var(--amber-soft)}
.note.err{background:var(--red-soft)}
.note.ok{background:var(--green-soft)}

.form-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;max-height:calc(100vh - 100px);overflow:auto}
.rail h3{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px}
.rail button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft)}
.rail .nm{font-size:.85rem;font-weight:500;min-width:0}
.rail .ct{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:center}
.minibar,.stack{display:flex;border-radius:2px;overflow:hidden;background:var(--empty)}
.minibar{grid-column:1/-1;height:4px}
.stack{height:12px;border-radius:3px}
.minibar i,.stack i{display:block;height:100%}
.rail-sel.fld{display:none}

.hero{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:var(--r);padding:18px 22px;display:grid;gap:12px}
.hero-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start}
.hero h1{font-size:1.35rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.progress{display:flex;align-items:center;gap:12px;font-size:.84rem;color:var(--muted)}
.progress .bar{flex:1;height:8px;background:var(--empty);border-radius:4px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}

.sec-head{margin:24px 0 12px;display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.25rem}
.edited{font-size:.8rem;color:var(--muted)}
.sub-h{margin:22px 0 8px;font-size:.9rem;font-weight:700;color:var(--accent)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;margin-bottom:10px;border-left:5px solid var(--line)}
.q[data-s="1"]{border-left-color:var(--red)}
.q[data-s="2"]{border-left-color:var(--amber)}
.q[data-s="3"]{border-left-color:var(--green)}
.q[data-s="na"]{border-left-color:var(--na)}
.q-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q-id{color:var(--muted);flex:none}
.q-text{font-weight:600;max-width:80ch;flex:1;min-width:0}
.prev{font-size:.74rem;color:var(--muted);white-space:nowrap}
.hint{font-size:.84rem;color:var(--muted)}
.docs{display:flex;flex-wrap:wrap;gap:6px}
.doc{font-size:.78rem;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);text-decoration:none;color:var(--fg);max-width:100%}
a.doc:hover{border-color:var(--accent);color:var(--accent)}
.doc.gap{background:transparent;border-style:dashed;color:var(--muted)}
.doc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(70px,auto);gap:8px}
.ch{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;min-width:0}
.ch b{font-size:1rem;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2)}
.ch small{font-size:.82rem;line-height:1.2}
.ch:hover:not(:disabled){border-color:var(--muted)}
.ch:disabled{cursor:default}
.ch[data-v="1"][aria-pressed="true"]{border-color:var(--red);background:var(--red);color:var(--on-solid)}
.ch[data-v="2"][aria-pressed="true"]{border-color:var(--amber);background:var(--amber);color:var(--amber-fg)}
.ch[data-v="3"][aria-pressed="true"]{border-color:var(--green);background:var(--green);color:var(--on-solid)}
.ch[aria-pressed="true"] b{background:rgba(255,255,255,.28)}
.ch[data-v="na"]{justify-content:center}
.ch[data-v="na"][aria-pressed="true"]{border-color:var(--na);background:var(--na);color:var(--on-solid)}
.follow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,.9fr);gap:10px;background:var(--surface-2);border-radius:6px;padding:10px 12px}
.follow.one{grid-template-columns:minmax(0,1fr)}
.req{color:var(--red)}
.nav-btns{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

.review{display:grid;gap:8px}
.rv-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 110px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.n{background:var(--na-soft);color:var(--muted)}
.jump{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-family:var(--f-mono);font-size:.8rem}
.confirm{display:grid;gap:10px;border:2px solid var(--accent);border-radius:8px;padding:14px;background:var(--surface)}
.demo-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.8rem;background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-bottom:14px;color:var(--muted)}
.demo-bar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}

@media (max-width:980px){
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .rail-sel.fld{display:flex;margin-top:14px}
  .follow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (max-width:620px){
  .grid3{grid-template-columns:minmax(0,1fr)}
  .choices{grid-template-columns:repeat(3,minmax(0,1fr))}
  .choices .ch[data-v="na"]{grid-column:1/-1}
  .ch{flex-direction:column;text-align:center;gap:4px;padding:8px 4px}
  .ch small{font-size:.72rem}
  .follow{grid-template-columns:minmax(0,1fr)}
  .rv-row{grid-template-columns:minmax(0,1fr) auto}
  .rv-row .stack{grid-column:1/-1;order:3}
  .brand span,.who{display:none}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

    <div class="brand"><b>Country Office Annual Requirements</b><span id="brand-sub">Annual self-assessment</span></div>

</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

/* ================= AUTH (ArcGIS OAuth 2.0 with PKCE) ================= */
const Auth = {
  get(){ return LS.get("coar-auth"); },
  valid(){ const a = this.get(); return a && a.token && a.expires > Date.now() + 60000; },
  async start(){
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier))));
    const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
    LS.set("coar-pkce", {verifier, state});
    const url = `${CONFIG.PORTAL_URL}/sharing/rest/oauth2/authorize?` + new URLSearchParams({client_id:CONFIG.CLIENT_ID, response_type:"code", redirect_uri:CONFIG.REDIRECT_URI, code_challenge:challenge, code_challenge_method:"S256", state, expiration:"20160"});
    if (window.top !== window.self) {            // inside SharePoint iframe: sign in through a popup
      const w = window.open(url, "coar-login", "width=520,height=720");
      if (!w) { renderSignIn("Your browser blocked the sign-in window. Allow pop-ups for this page and try again."); return; }
    } else location.assign(url);
  },
  async exchange(code, state){
    const p = LS.get("coar-pkce");
    if (!p || p.state !== state) throw new Error("Sign-in could not be verified. Please try again.");
    const r = await postForm(`${CONFIG.PORTAL_URL}/sharing/rest/oauth2/token`, {client_id:CONFIG.CLIENT_ID, grant_type:"authorization_code", code, redirect_uri:CONFIG.REDIRECT_URI, code_verifier:p.verifier});
    LS.del("coar-pkce"); this.store(r);
  },
  async refresh(){
    const a = this.get(); if (!a || !a.refresh) return false;
    try { const r = await postForm(`${CONFIG.PORTAL_URL}/sharing/rest/oauth2/token`, {client_id:CONFIG.CLIENT_ID, grant_type:"refresh_token", refresh_token:a.refresh}); this.store({...r, refresh_token: r.refresh_token || a.refresh}); return true; }
    catch(e){ return false; }
  },
  store(r){ LS.set("coar-auth", {token:r.access_token, expires:Date.now() + r.expires_in*1000, refresh:r.refresh_token, username:r.username}); },
  async token(){ if (this.valid()) return this.get().token; if (await this.refresh()) return this.get().token; throw Object.assign(new Error("Your session has expired. Sign in again to keep saving."), {auth:true}); },
  signOut(){ LS.del("coar-auth"); location.reload(); }
};
function b64url(bytes){ let s = ""; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function postForm(url, params){
  const res = await fetch(url, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams({f:"json", ...params})});
  const j = await res.json();
  if (j.error) { const e = new Error(j.error.message || "Request failed"); e.code = j.error.code; if (j.error.code === 498 || j.error.code === 499) e.auth = true; throw e; }
  return j;
}
async function agsPost(url, params){ return postForm(url, {...params, token: await Auth.token()}); }

/* ================= DATA STORES ================= */
class ArcGISStore {
  constructor(url){ this.url = url.replace(/\/$/, ""); }
  async init(){
    let info;
    try { info = await agsPost(this.url, {}); }
    catch(e) { if (e.auth) throw e; throw new Error("You don't have access to this country office's assessment, or its address in config.js is wrong. Ask HQ to check that you are in the right COAR group."); }
    this.fields = {}; this.types = {};
    info.fields.forEach(f => { this.fields[f.name.toLowerCase()] = f.name; this.types[f.name] = f.type; });
    this.oid = info.objectIdField || (info.fields.find(f => f.type === "esriFieldTypeOID") || {}).name;
    this.missing = ["country","assessment_year","submission_status",ITEMS[0].id,"last_section",SECTIONS[0].code+"_edited_by"].filter(f => !this.fields[f.toLowerCase()]);
    if (this.missing.length) throw new Error("The layer is missing fields this form needs: " + this.missing.join(", ") + ". Republish the survey from the latest form spreadsheet.");
  }
  f(n){ return this.fields[n.toLowerCase()]; }
  toLayer(attrs){ const o = {}; for (const [k,v] of Object.entries(attrs)) { const f = this.f(k); if (!f) continue;
      if (this.types[f] === "esriFieldTypeDate") o[f] = v ? (typeof v === "number" ? v : Date.parse(v + "T12:00:00Z")) : null;
      else if (/Integer|Double|Single/.test(this.types[f])) o[f] = (v === "" || v == null) ? null : Number(v);
      else o[f] = v === "" ? null : v; }
    return o; }
  fromLayer(a){ const o = {}; ALL_FIELDS.forEach(k => { const f = this.f(k); if (!f) return; let v = a[f];
      o[k] = v; }); return o; }
  async find(country, year){
    const where = `${this.f("country")}='${country.replace(/'/g,"''")}' AND ${this.f("assessment_year")}='${String(year).replace(/'/g,"''")}'`;
    const r = await agsPost(this.url + "/query", {where, outFields:"*", orderByFields:this.oid + " ASC", returnGeometry:"false"});
    const ft = r.features && r.features[0];
    return ft ? {oid: ft.attributes[this.oid], attrs: this.fromLayer(ft.attributes)} : null;
  }
  async create(attrs){
    const r = await agsPost(this.url + "/applyEdits", {adds: JSON.stringify([{attributes: this.toLayer(attrs)}])});
    const x = r.addResults && r.addResults[0];
    if (!x || !x.success) throw new Error((x && x.error && x.error.description) || "Could not create the assessment record.");
    return x.objectId;
  }
  async update(oid, attrs){
    const a = this.toLayer(attrs); a[this.oid] = oid;
    const r = await agsPost(this.url + "/applyEdits", {updates: JSON.stringify([{attributes: a}])});
    const x = r.updateResults && r.updateResults[0];
    if (!x || !x.success) throw new Error((x && x.error && x.error.description) || "Save failed.");
  }
}
class DemoStore {
  constructor(){ this.key = "coar-demo-db"; if (!LS.get(this.key)) LS.set(this.key, seedDemo()); }
  db(){ return LS.get(this.key); }
  async init(){ await wait(250); }
  async find(country, year){ await wait(300); const r = this.db().records.find(x => x.attrs.country === country && String(x.attrs.assessment_year) === String(year)); return r ? JSON.parse(JSON.stringify(r)) : null; }
  async create(attrs){ await wait(300); const db = this.db(); const oid = db.next++; db.records.push({oid, attrs:{...attrs}}); LS.set(this.key, db); return oid; }
  async update(oid, attrs){ await wait(450); if (APP.demoOffline) throw new Error("No connection"); const db = this.db(); const r = db.records.find(x => x.oid === oid); Object.assign(r.attrs, attrs); LS.set(this.key, db); }
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function seedDemo(){
  const recs = []; let next = 1;
  const mk = (country, year, secs, who, status) => {
    const a = {country, assessment_year:year, submission_status:status, respondent_role:"country_director", respondent_name:who};
    let seed = year * 7 + country.length;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    secs.forEach(code => { bySec(code).forEach(it => { const x = rnd(); const s = x < .15 ? "1" : x < .42 ? "2" : "3"; a[it.id] = s;
        if (s !== "3") a[it.id+"_comment"] = "Partly documented"; });
      Object.assign(a, calcSection(a, code)); a[code+"_edited_by"] = who; a[code+"_edited_at"] = Date.UTC(2026, 8, 24, 10, 15); });
    Object.assign(a, calcTotals(a)); a.last_section = secs.length;
    recs.push({oid: next++, attrs:a});
  };
  mk("bosnia_and_herzegovina", "2026", ["SMS","INT","DON","COM"], "Amra Hodžić", "draft");
  mk("bosnia_and_herzegovina", "2025", SECTIONS.map(s => s.code), "Amra Hodžić", "submitted");
  return {next, records: recs};
}

/* ================= SCORING ================= */
function calcSection(a, code){
  let r=0, am=0, g=0, na=0;
  bySec(code).forEach(it => { const v = a[it.id]; if (v === "1") r++; else if (v === "2") am++; else if (v === "3") g++; else if (v === "na") na++; });
  const n = r + am + g, avg = n ? Math.round((r + am*2 + g*3) / n * 100) / 100 : null;
  return {[code+"_red"]:r, [code+"_amber"]:am, [code+"_green"]:g, [code+"_na"]:na, [code+"_done"]:r+am+g+na, [code+"_avg"]:avg, [code+"_rag"]:rag(avg)};
}
function calcTotals(a){
  const t = {red:0, amber:0, green:0, na:0};
  SECTIONS.forEach(s => { const c = calcSection(a, s.code); t.red += c[s.code+"_red"]; t.amber += c[s.code+"_amber"]; t.green += c[s.code+"_green"]; t.na += c[s.code+"_na"]; });
  const n = t.red + t.amber + t.green, avg = n ? Math.round((t.red + t.amber*2 + t.green*3) / n * 100) / 100 : null;
  return {total_red:t.red, total_amber:t.amber, total_green:t.green, total_na:t.na, total_done:n + t.na, overall_avg:avg, overall_rag:rag(avg)};
}
const rag = v => v == null ? "" : v >= 2.5 ? "Green" : v >= 1.75 ? "Amber" : "Red";
const answered = (a, it) => a[it.id] != null && a[it.id] !== "";
function secProgress(a, code){ const its = bySec(code); const c = calcSection(a, code); return {...c, n: its.length, done: c[code+"_done"], r:c[code+"_red"], am:c[code+"_amber"], g:c[code+"_green"], na:c[code+"_na"]}; }
const fmtDate = ms => ms ? new Date(ms).toLocaleString(undefined, {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "";

/* ================= APP STATE ================= */
const APP = { user:null, store:null, country:null, year:CONFIG.DEFAULT_YEAR, role:null, oid:null, rec:{}, prev:{}, pending:{}, sec:0,
  saveState:"saved", lastSaved:null, timer:null, retry:null, saving:false, demoOffline:false, confirming:false, welcome:null };

function readOnly(){ return APP.rec.submission_status === "submitted"; }
function pendingKey(){ return `coar-pending:${APP.country}:${APP.year}`; }

function setSave(state, text){
  APP.saveState = state; const el = document.getElementById("savest"); el.hidden = false; el.dataset.s = state;
  document.getElementById("savest-t").textContent = text || ({saved: APP.lastSaved ? "All changes saved · " + new Date(APP.lastSaved).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "All changes saved", saving:"Saving…", offline:"Not saved yet – offline, retrying", error:"Not saved – sign in again"})[state];
}

function setField(name, value, code){
  if (readOnly()) return;
  APP.rec[name] = value; APP.pending[name] = value;
  if (code) {
    const stamp = {[code+"_edited_by"]: APP.user.name, [code+"_edited_at"]: Date.now()};
    Object.assign(APP.rec, stamp, calcSection(APP.rec, code)); Object.assign(APP.pending, stamp, calcSection(APP.rec, code));
    const t = calcTotals(APP.rec); Object.assign(APP.rec, t); Object.assign(APP.pending, t);
  }
  LS.set(pendingKey(), APP.pending);
  setSave("saving", "Unsaved changes…");
  clearTimeout(APP.timer); APP.timer = setTimeout(flush, 1200);
}

async function flush(){
  clearTimeout(APP.timer);
  if (APP.saving) { APP.timer = setTimeout(flush, 800); return true; }
  const batch = APP.pending; if (!Object.keys(batch).length) { if (APP.saveState !== "saved") setSave("saved"); return true; }
  APP.pending = {}; APP.saving = true; setSave("saving");
  try {
    await APP.store.update(APP.oid, batch);
    APP.lastSaved = Date.now(); APP.saving = false;
    if (!Object.keys(APP.pending).length) { LS.del(pendingKey()); setSave("saved"); } else LS.set(pendingKey(), APP.pending);
    clearTimeout(APP.retry); return true;
  } catch(e) {
    APP.saving = false; APP.pending = {...batch, ...APP.pending}; LS.set(pendingKey(), APP.pending);
    if (e.auth) { setSave("error"); renderSignIn(e.message, true); return false; }
    setSave("offline"); clearTimeout(APP.retry); APP.retry = setTimeout(flush, 15000); return false;
  }
}
window.addEventListener("online", () => flush());
window.addEventListener("beforeunload", e => { if (Object.keys(APP.pending).length || APP.saving) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

async function openAssessment(){
  const url = DEMO ? null : (CONFIG.COUNTRY_LAYER_URLS[APP.country] || CONFIG.LAYER_URL);
  APP.store = DEMO ? new DemoStore() : new ArcGISStore(url);
  await APP.store.init();
  let rec = await APP.store.find(APP.country, APP.year);
  let isNew = false;
  if (!rec) {
    const attrs = {country:APP.country, assessment_year:APP.year, submission_status:"draft", ho_review_status:"not_reviewed", respondent_role:APP.role, respondent_name:APP.user.name, respondent_email:APP.user.email, last_section:0};
    await APP.store.create(attrs);
    rec = await APP.store.find(APP.country, APP.year);   // re-read: if two people created at once, everyone uses the oldest record
    isNew = true;
  }
  APP.oid = rec.oid; APP.rec = rec.attrs;
  const prevRec = await APP.store.find(APP.country, String(Number(APP.year) - 1)).catch(() => null);
  APP.prev = prevRec ? prevRec.attrs : {};
  // restore anything that did not reach the server last time
  const backup = LS.get(pendingKey());
  APP.pending = {};
  if (backup && Object.keys(backup).length && !readOnly()) { Object.assign(APP.rec, backup); APP.pending = {...backup}; }
  const done = ITEMS.filter(it => answered(APP.rec, it)).length;
  const firstOpen = SECTIONS.findIndex(s => secProgress(APP.rec, s.code).done < bySec(s.code).length);
  const lastSec = Number(APP.rec.last_section);
  APP.sec = readOnly() ? SECTIONS.length : (Number.isFinite(lastSec) && lastSec >= 0 && lastSec <= SECTIONS.length && APP.rec.last_section != null ? lastSec : Math.max(0, firstOpen));
  const lastEdit = SECTIONS.map(s => ({t: APP.rec[s.code+"_edited_at"], by: APP.rec[s.code+"_edited_by"]})).filter(x => x.t).sort((a,b) => b.t - a.t)[0];
  APP.welcome = isNew ? {isNew:true} : {done, lastEdit};
  APP.lastSaved = Date.now();
  if (!readOnly()) { APP.rec.respondent_role = APP.role; APP.pending.respondent_role = APP.role; APP.pending.respondent_name = APP.user.name; if (APP.user.email) APP.pending.respondent_email = APP.user.email; flush(); }
  setSave(Object.keys(APP.pending).length ? "saving" : "saved");
  document.getElementById("brand-sub").textContent = `${lbl(DATA.countries, APP.country)} · ${APP.year}`;
  renderForm(); window.scrollTo({top:0});
}

function goSection(i){

function renderReview(){

  return `<div class="sec-head"><div><div class="eyebrow">${ro ? "Submitted assessment" : "Final step"}</div><h2>${ro ? "Summary" : "Review and submit"}</h2></div>

    ${!ro && unanswered.length ? `<p class="note warn">${unanswered.length} ${unanswered.length===1?"requirement is":"requirements are"} not answered yet: ${jump(unanswered)}</p>` : ""}
    <div class="review">${SECTIONS.map((s, i) => { const p = secProgress(a, s.code);
      return `<div class="rv-row"><div><b>${esc(secName(s))}</b><div class="edited">${p.done}/${p.n} answered${a[s.code+"_edited_by"] ? ` · ${esc(a[s.code+"_edited_by"])}, ${fmtDate(a[s.code+"_edited_at"])}` : ""}</div></div>
        <div class="stack">${bars(p)}</div><button class="btn" data-go="${i}">${ro ? "View" : p.done === p.n ? "Edit" : "Continue"}</button></div>`; }).join("")}</div>
    <div class="fld" style="margin-top:16px"><label for="cd_comment">Country Director's overall comment (optional)</label><textarea id="cd_comment" data-f="cd_comment" ${ro?"disabled":""}>${esc(a.cd_comment)}</textarea></div>
    ${ro ? "" : APP.confirming ? `<div class="confirm" style="margin-top:16px"><b>Submit the ${esc(APP.year)} assessment for ${esc(lbl(DATA.countries, APP.country))} to HQ?</b><span class="muted">After submitting, the form becomes read-only for the country office. HQ can reopen it if something needs correcting.</span><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="do-submit">Yes, submit to HQ</button><button class="btn" id="cancel-submit">Cancel</button></div></div>`
      : `<div class="nav-btns"><button class="btn" data-go="${SECTIONS.length-1}">← Back</button>
        ${canSubmit ? `<button class="btn pri" id="submit" ${complete ? "" : "disabled"}>Submit to HQ</button>` : `<span class="muted" style="align-self:center">Your answers are saved. The Country Director submits the assessment to HQ.</span>`}</div>
        ${canSubmit && !complete ? `<p class="muted" style="font-size:.84rem;text-align:right">Submit becomes available when every requirement is answered.</p>` : ""}`}`;
}

function bindForm(){
  const root = $app();
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goSection(+b.dataset.go));
  root.querySelectorAll("[data-goitem]").forEach(b => b.onclick = () => goSection(SECTIONS.findIndex(s => s.code === b.dataset.goitem)));
  root.querySelectorAll(".ch").forEach(b => b.onclick = () => {
    const id = b.dataset.id, val = b.dataset.v, cur = APP.rec[id];
    const code = ITEMS.find(i => i.id === id).code;
    setField(id, cur === val ? null : val, code);
    const y = b.getBoundingClientRect().top; APP.welcome = null; renderForm();
    const nb = document.querySelector(`.ch[data-id="${id}"][data-v="${val}"]`); if (nb) window.scrollBy(0, nb.getBoundingClientRect().top - y);
  });
  root.querySelectorAll("[data-f]").forEach(el => {
    const f = el.dataset.f, it = ITEMS.find(i => f.startsWith(i.id + "_"));
    const h = () => setField(f, el.value, it ? it.code : null);
    el.addEventListener(el.tagName === "SELECT" || el.type === "date" ? "change" : "input", h);
  });
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el[ev] = fn; };
  on("f-jump", "onchange", e => goSection(+e.target.value));
  on("savenow", "onclick", async () => { const ok = await flush(); toast(ok ? "Saved" : "Could not save yet – your answers are kept and will be sent when the connection is back"); });
  on("change", "onclick", async () => { await flush(); renderStart(); });
  on("submit", "onclick", () => { APP.confirming = true; renderForm(); });
  on("cancel-submit", "onclick", () => { APP.confirming = false; renderForm(); });
  on("do-submit", "onclick", async () => {
    const btn = document.getElementById("do-submit"); btn.disabled = true; btn.textContent = "Submitting…";
    Object.assign(APP.pending, {submission_status:"submitted", submitted_by:APP.user.name, submitted_at:Date.now()});
    const ok = await flush();
    if (ok) { Object.assign(APP.rec, {submission_status:"submitted", submitted_by:APP.user.name, submitted_at:Date.now()}); APP.confirming = false; renderForm(); toast("Submitted to HQ"); }
    else { delete APP.pending.submission_status; delete APP.pending.submitted_by; delete APP.pending.submitted_at; btn.disabled = false; btn.textContent = "Yes, submit to HQ"; toast("Could not submit – check your connection and try again"); }
  });
  on("d-off", "onchange", e => { APP.demoOffline = e.target.checked; if (!e.target.checked) flush(); });
  on("d-reset", "onclick", () => { LS.del("coar-demo-db"); LS.del(pendingKey()); LS.del("coar-last"); APP.country = null; APP.role = null; APP.pending = {}; renderStart(); document.getElementById("savest").hidden = true; });
}

/* ================= BOOT ================= */
async function boot(){
  if (window.COAR_EXPECT_CONFIG && !window.COAR_CONFIG) {
    $app().innerHTML = `<div class="card"><div><div class="eyebrow">Setup problem</div><h1>The settings file could not be read</h1></div>
      <p>${window.COAR_CONFIG_MISSING ? "config.js was not found next to this page. Check that a file named exactly <b>config.js</b> (all lowercase, not config (1).js or config.js.txt) is in the same place as index.html on GitHub." : "config.js was found but contains a typing error, so it could not be read. Check that no quote marks, commas or brackets were removed or added, or upload a fresh copy."}</p></div>`;
    return;
  }
  if (DEMO) {
    document.getElementById("demo-chip").hidden = false;
    APP.user = {name:"Demo user", email:"", username:"demo"};
    document.getElementById("who").textContent = "Demo user";
    renderStart(); return;
  }
  const q = new URLSearchParams(location.search);
  if (q.get("code") || q.get("error")) {
    if (window.opener && window.opener !== window) {        // popup: hand the result to the page inside SharePoint
      try { window.opener.postMessage({type:"coar-auth", code:q.get("code"), state:q.get("state"), error:q.get("error_description")}, location.origin); } catch(e){}
      document.body.innerHTML = "<p style='font-family:sans-serif;padding:24px'>Signed in. You can close this window.</p>"; window.close(); return;
    }
    history.replaceState(null, "", location.pathname);
    if (q.get("error")) { renderSignIn(q.get("error_description") || "Sign-in was cancelled."); return; }
    try { await Auth.exchange(q.get("code"), q.get("state")); } catch(e) { renderSignIn(e.message); return; }
  }
  if (!Auth.valid() && !(await Auth.refresh())) { renderSignIn(); return; }
  await afterSignIn();
}
async function afterSignIn(){
  try {
    const me = await agsPost(`${CONFIG.PORTAL_URL}/sharing/rest/community/self`, {});
    APP.user = {name: me.fullName || me.username, email: me.email || "", username: me.username};
  } catch(e) { renderSignIn(e.message); return; }
  document.getElementById("who").innerHTML = `${esc(APP.user.name)} · <button class="linkbtn" id="signout">Sign out</button>`;
  document.getElementById("signout").onclick = async () => { await flush(); Auth.signOut(); };
  if (APP.oid) { flush(); renderForm(); } else renderStart();
}
window.addEventListener("message", async e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "coar-auth") return;
  if (e.data.error || !e.data.code) { renderSignIn(e.data.error || "Sign-in was cancelled."); return; }
  try { await Auth.exchange(e.data.code, e.data.state); await afterSignIn(); } catch(err) { renderSignIn(err.message); }
});
boot();
</script>
